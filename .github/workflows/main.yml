name: Build Aero Browser EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine'
          cache: true
          
      - name: Configure CMake
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{env.Qt6_DIR}}"
        
      - name: Build Release
        run: cmake --build build --config Release -j
        
      - name: Deploy Qt DLLs
        run: ${{env.Qt6_DIR}}/bin/windeployqt.exe build/Release/AeroBrowser.exe --release --webengine --no-translations
        
      - name: Zip EXE + DLLs
        run: Compress-Archive -Path build/Release/* -DestinationPath AeroBrowser-Windows.zip
        
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AeroBrowser-Windows
          path: AeroBrowser-Windows.zip
